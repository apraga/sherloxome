[package]
name = "sherloxome"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
glob = "0.3.3"
itertools = "0.14.0"
polars = { version = "0.53.0", features = ["csv", "lazy"] }
rayon = "1.11.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11"
