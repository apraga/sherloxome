[package]
name = "sherloxome"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.10"
glob = "0.3.3"
itertools = "0.14.0"
log = "0.4.29"
noodles = { version = "0.108.0", features = ["vcf", "bed", "bgzf", "core"] }
polars = { version = "0.51.0", features = ["csv", "lazy"] }
rayon = "1.11.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.11"
vega_lite_4 = { version = "0.8.1" }
