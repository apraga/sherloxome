fasta = "/Work/Groups/bisonex/dgenomes/genome-human/GCA_000001405.15_GRCh38_full_analysis_set.fna"

# Configuration for raw GIAB patients data
[real]
patients = ["HG001", "HG002", "HG003", "HG004", "HG005", "HG006", "HG007"]
depths = ["50x", "75x", "100x"]
captures = ["agilent"] #, "idt", "truseq"]
sequencers = ["hiseq4000", "novaseq"]

# Insert controls into a single patient BAM or generate in-silico fastq
[silico]
capture = "agilent"
# Generate a fastq fully in silico
fastq = true
# Either an URL or a local link to insert variants in a BAM file
bam = "https://storage.googleapis.com/brain-genomics-public/research/sequencing/grch38/bam/hiseq4000/wes_agilent/50x/HG002.hiseq4000.wes-agilent.50x.dedup.grch38.bam"
outdir = "silico"


# Define here the name of the capture (used in the filename) and the bed file
[capture]
idt = "data/capture/idt_capture.grch38.bed"
truseq = "data/capture/truseq-dna-exome-targeted-regions-manifest-v1-2-lifted-grch38.bed"
agilent = "data/capture/agilent.targets.grch38.bed"
