 # URL to fasta, or link to local version, otherwise download it from NCBI
 # We need a full fasta for silico data to avoid remapping error
fasta = "data/ref/GCA_000001405.15_GRCh38_full_analysis_set.fna"
# For CI, we do not need the full fasta during benchmarking. To avoid duplicating the FASTA and
# running out-of-memory, use a smaller reference
# `rtg format` copies the whole sequence to disk, unlike hap.py's --reference
# rtg_fasta = "data/ref/chr21.fna"

# Configuration for raw GIAB patients data
[real]
patients = [] # #["HG001", "HG002", "HG003", "HG004", "HG005", "HG006", "HG007"]
depths = [50] #, 75, 100]
captures = ["agilent"] #, "idt", "truseq"]
sequencers = ["hiseq4000"] #, "novaseq"]

# Generate control data from sampled clinvar. Result will be a fastq in data/exp_raw
[silico]
# VCF containing clinvar variants. If not set, the VCF will be downloaded from NCBI
clinvar = "data/exp_raw/clinvar.vcf.gz"
# Number of random clinvar variants sample. Default is 1000
nb_variants = 1000
# Intervals from which clinvar variants will be sampled. Default is the intersection of our
# 3 capture kits 
capture = "agilent-idt-truseq"
# URL to fasta, or link to local version, otherwise download it from NCBI
# fasta =  "https://github.com/nf-core/test-datasets/blob/sarek3/data/genomics/homo_sapiens/genome/chr21/sequence/genome.fasta"

# This section enables simuscop FASTQ generation (remove section to disable)
[silico.simuscop]
# Pre-built seqToProfile profile directory.
# The profile must follow the filenaming scheme
profile = "data/ref/profiles/hiseq4000_agilent_50x.profile"
capture = "agilent"
# Sequencing coverage
coverage = 50

# This section enables varben BAM editing (remove section to disable)
# [silico.varben]
# List of BAM files to insert variants into
# capture = "agilent"
# bam_files = ["data/exp_raw/HG002_hiseq4000_agilent_50x.bam", "data/exp_raw/HG002_novaseq_agilent_75x.bam"]
# Minimal read depth to insert a variant
# mindepth = 30

# Define here the name of alls captures and the bed file
[capture]
# Those values are mandatory for GIAB data (Baid 2020)
idt = "data/ref/capture/idt_capture.grch38.bed"
truseq = "data/ref/capture/truseq-dna-exome-targeted-regions-manifest-v1-2-lifted-grch38.bed"
agilent = "data/ref/capture/agilent.targets.grch38.bed"
agilent-idt-truseq = "data/ref/capture/agilent-idt-truseq.bed"
# For testing
agilent-col6a1 = "data/ref/capture/agilent.targets.grch38.bed"

