name: COL6A1 benchmarks

on:
  push:
    branches:
    - main
    - ci

  workflow_dispatch:

jobs:
  # Built once and shared by the test-* jobs below (via artifact) so we don't pay for
  # cargo build --release three times per push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build benchmark tool
        run: cargo build --release

      - name: Upload benchmark tool
        uses: actions/upload-artifact@v4
        with:
          name: sherloxome-bin
          path: target/release/sherloxome
          retention-days: 1

  test-giab:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout reproducible-sarek-germline
        uses: actions/checkout@v5
        with:
          repository: apraga/reproducible-sarek-germline
          path: reproducible-sarek-germline
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v14
        with:
          name: sherloxome
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Use our other cache to avoid rebuilding everything
      - uses: cachix/cachix-action@v14
        with:
          name: reproducible-sarek-germline

      - name: Download benchmark tool
        uses: actions/download-artifact@v4
        with:
          name: sherloxome-bin
          path: target/release
      - run: chmod +x target/release/sherloxome

      - name: Run sarek pipeline
        run: |
          nix develop ./reproducible-sarek-germline --command \
            nextflow run nf-core/sarek -r 3.5.1 \
              --input tests/samplesheet-hg002-col6a1.csv \
              -c conf/test_chr21.conf \
              --outdir tests/test-col6a1

      - name: Run benchmark
        run: |
          nix shell .#default --command \
            ./target/release/sherloxome benchmark \
              --input tests/test-col6a1/ \
              --output tests/test-col6a1/

      - name: Check 3 variants found
        run: |
          python3 - <<'EOF'
          import csv, sys
          path = "tests/test-col6a1/HG002_hiseq4000_agilent-col6a1_50x.summary.csv"
          with open(path) as f:
              for row in csv.DictReader(f):
                  if row["Type"] == "SNP" and row["Filter"] == "PASS":
                      tp, total = int(row["TRUTH.TP"]), int(row["TRUTH.TOTAL"])
                      if total != 3 or tp != 3:
                          print(f"FAIL: expected 3/3 SNPs, got {tp}/{total}", file=sys.stderr)
                          sys.exit(1)
                      print(f"OK: {tp}/{total} SNPs found")
                      sys.exit(0)
          print("FAIL: SNP PASS row not found", file=sys.stderr)
          sys.exit(1)
          EOF

  test-simuscop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout reproducible-sarek-germline
        uses: actions/checkout@v5
        with:
          repository: apraga/reproducible-sarek-germline
          path: reproducible-sarek-germline
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v14
        with:
          name: sherloxome
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Use our other cache to avoid rebuilding everything
      - uses: cachix/cachix-action@v14
        with:
          name: reproducible-sarek-germline

      - name: Download benchmark tool
        uses: actions/download-artifact@v4
        with:
          name: sherloxome-bin
          path: target/release
      - run: chmod +x target/release/sherloxome

      # Simuscop uses the pre-built profile committed in data/ref/, so no BWA index
      # or seqToProfile run is needed here (unlike the varben job).
      - name: Run setup
        run: |
          nix shell .#default --command \
            ./target/release/sherloxome setup --config tests/config-simuscop-ci.toml

      - name: Run sarek pipeline
        run: |
          nix develop ./reproducible-sarek-germline --command \
            nextflow run nf-core/sarek -r 3.5.1 \
              --input samplesheet.csv \
              -c conf/test_chr21.conf \
              --outdir tests/test-simuscop

      - name: Run benchmark
        run: |
          nix shell .#default --command \
            ./target/release/sherloxome benchmark \
              --config tests/config-simuscop-ci.toml \
              --input tests/test-simuscop/ \
              --output tests/test-simuscop/

      - name: Check recall == 1
        run: |
          python3 - <<'EOF'
          import csv, sys
          path = "tests/test-simuscop/nopatient_hiseq4000_agilent-col6a1_50x_simuscop.summary.csv"
          with open(path) as f:
              for row in csv.DictReader(f):
                  if row["Type"] == "SNP" and row["Filter"] == "PASS":
                      recall = float(row["METRIC.Recall"])
                      tp, total = int(row["TRUTH.TP"]), int(row["TRUTH.TOTAL"])
                      if total == 0 or recall < 1.0:
                          print(f"FAIL: expected recall=1.0, got recall={recall}, {tp}/{total}", file=sys.stderr)
                          sys.exit(1)
                      print(f"OK: recall={recall}, {tp}/{total} SNPs found")
                      sys.exit(0)
          print("FAIL: SNP PASS row not found", file=sys.stderr)
          sys.exit(1)
          EOF

  test-varben:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout reproducible-sarek-germline
        uses: actions/checkout@v5
        with:
          repository: apraga/reproducible-sarek-germline
          path: reproducible-sarek-germline
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v14
        with:
          name: sherloxome
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Use our other cache to avoid rebuilding everything
      - uses: cachix/cachix-action@v14
        with:
          name: reproducible-sarek-germline

      - name: Download benchmark tool
        uses: actions/download-artifact@v4
        with:
          name: sherloxome-bin
          path: target/release
      - run: chmod +x target/release/sherloxome

      - name: Cache BWA index for chr21
        id: bwa-index-cache
        uses: actions/cache@v4
        with:
          path: |
            data/ref/chr21.fna.amb
            data/ref/chr21.fna.ann
            data/ref/chr21.fna.bwt
            data/ref/chr21.fna.pac
            data/ref/chr21.fna.sa
          key: bwa-index-chr21-${{ hashFiles('data/ref/chr21.fna') }}

      - name: Build BWA index
        if: steps.bwa-index-cache.outputs.cache-hit != 'true'
        run: nix shell .#default --command bwa index data/ref/chr21.fna

      - name: Run setup
        run: |
          nix shell .#default --command \
            ./target/release/sherloxome setup --config tests/config-varben-ci.toml

      - name: Run sarek pipeline
        run: |
          nix develop ./reproducible-sarek-germline --command \
            nextflow run nf-core/sarek -r 3.5.1 \
              --input samplesheet.csv \
              -c conf/test_chr21.conf \
              --outdir tests/test-varben

      - name: Run benchmark
        run: |
          nix shell .#default --command \
            ./target/release/sherloxome benchmark \
              --config tests/config-varben-ci.toml \
              --input tests/test-varben/ \
              --output tests/test-varben/

      - name: Check recall == 1
        run: |
          python3 - <<'EOF'
          import csv, sys
          path = "tests/test-varben/HG002_hiseq4000_agilent-col6a1_50x_varben.summary.csv"
          with open(path) as f:
              for row in csv.DictReader(f):
                  if row["Type"] == "SNP" and row["Filter"] == "PASS":
                      recall = float(row["METRIC.Recall"])
                      tp, total = int(row["TRUTH.TP"]), int(row["TRUTH.TOTAL"])
                      if total == 0 or recall < 1.0:
                          print(f"FAIL: expected recall=1.0, got recall={recall}, {tp}/{total}", file=sys.stderr)
                          sys.exit(1)
                      print(f"OK: recall={recall}, {tp}/{total} SNPs found")
                      sys.exit(0)
          print("FAIL: SNP PASS row not found", file=sys.stderr)
          sys.exit(1)
          EOF
