name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout reproducible-germline-sarek
        uses: actions/checkout@v4
        with:
          repository: apraga/reproducible-germline-sarek
          path: reproducible-germline-sarek

      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build benchmark tool
        run: cargo build --release

      - name: Run sarek pipeline
        run: |
          nix develop ./reproducible-germline-sarek --command \
            nextflow run nf-core/sarek -r 3.5.1 \
              --input tests/samplesheet-hg002-col6a1.csv \
              -c conf/test_chr21.conf \
              --outdir tests/test-col6a1

      - name: Run benchmark
        run: |
          nix shell .#default --command \
            ./target/release/sherloxome benchmark \
              --input tests/test-col6a1/ \
              --output tests/test-col6a1/

      - name: Check 3 variants found
        run: |
          python3 - <<'EOF'
          import csv, sys
          path = "tests/test-col6a1/HG002_hiseq4000_agilent-col6a1_50x.summary.csv"
          with open(path) as f:
              for row in csv.DictReader(f):
                  if row["Type"] == "SNP" and row["Filter"] == "PASS":
                      tp, total = int(row["TRUTH.TP"]), int(row["TRUTH.TOTAL"])
                      if total != 3 or tp != 3:
                          print(f"FAIL: expected 3/3 SNPs, got {tp}/{total}", file=sys.stderr)
                          sys.exit(1)
                      print(f"OK: {tp}/{total} SNPs found")
                      sys.exit(0)
          print("FAIL: SNP PASS row not found", file=sys.stderr)
          sys.exit(1)
          EOF
