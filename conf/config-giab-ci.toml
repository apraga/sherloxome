fasta = "data/ref/chr21.fna"

[silico]
capture = "agilent-col6a1"
clinvar = "data/exp_raw/clinvar_col6a1.vcf.gz"
nb_variants = 2

[silico.simuscop]
# Pre-built profiles: skips seqToProfile (and the BAM/VCF it would need).
# Capture kit and coverage come from the filename. simuscop treats its coverage as a peak/max
# rather than a realized mean, so the depth is scaled internally (see
# MEAN_COVERAGE_REALIZATION in src/silico.rs) to target it as an actual mean over the
# capture region.
profiles = ["data/ref/profiles/hiseq4000_agilent-col6a1_50x.profile"]
dbsnp = true

[capture]
agilent-col6a1 = "data/ref/capture/agilent-col6a1.targets.grch38.bed"
